name: smartfab_material_tracker
description: A Material Tracking & Costing App for SmartFab Industries

publish_to: 'none' # Remove this line if you want to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  provider: ^6.1.1
  qr_code_scanner: ^1.0.1
  mobile_scanner: ^3.5.5
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  # Add other dependencies you may need later
  # For example:
  # firebase_core: ^latest_version

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  # If you plan to use any icons
  # icon_font: 
  #   path: fonts/
  #   file: material_icons.ttf
